# Fire Nation: charred crimson surfaces, flame-orange accent, and imperial gold.
# Put wallpapers next to this file; picking one applies the theme.

[Theme]
name = Fire Nation
# Built-in scheme for any color not set below.
scheme = gruvbox
# Effects from ~/.local/share/speshell/effects.
effects = fire

[Colors]
base     = #1d1315
mantle   = #170e10
crust    = #10090a
surface0 = #2c1b1d
surface1 = #3e2523
surface2 = #55322c
overlay0 = #7d554a
text     = #f3e3d3
subtext0 = #b99a89
subtext1 = #d6bca7
red      = #e8432e
peach    = #f5853a
yellow   = #f2c14e
rosewater = #f3e3d3
accent   = #f0702f
