# Earth Kingdom: mossy stone surfaces, jade accent, and Ba Sing Se gold.
# Put wallpapers next to this file; picking one applies the theme.

[Theme]
name = Earth Kingdom
# Built-in scheme for any color not set below.
scheme = everforest
# Effects from ~/.local/share/speshell/effects.
effects = earth

[Colors]
base     = #171a13
mantle   = #12150f
crust    = #0d0f0a
surface0 = #22281b
surface1 = #2f3725
surface2 = #3f4832
overlay0 = #677052
text     = #e9e6d3
subtext0 = #a4a68b
subtext1 = #c6c6ad
green    = #8fbf5a
yellow   = #d9b44a
peach    = #d99a5a
rosewater = #e9e6d3
accent   = #8fbf5a
