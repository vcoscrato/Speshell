# Water Tribe: deep polar-sea surfaces, ice-blue accent, and moonlit whites.
# Put wallpapers next to this file; picking one applies the theme.

[Theme]
name = Water Tribe
# Built-in scheme for any color not set below.
scheme = nord
# Effects from ~/.local/share/speshell/effects.
effects = water

[Colors]
base     = #0f1a22
mantle   = #0c151c
crust    = #081016
surface0 = #152530
surface1 = #1d3240
surface2 = #284354
overlay0 = #4a6577
text     = #e3eef4
subtext0 = #93aab8
subtext1 = #b6c9d4
blue     = #4f9fd9
sky      = #7fd3f0
teal     = #5cc6c0
lavender = #a9b8f0
rosewater = #e3eef4
accent   = #4fb3d9
