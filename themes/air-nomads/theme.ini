# Air Nomads: dusk-sky slate surfaces, saffron accent, and arrow blue.
# Put wallpapers next to this file; picking one applies the theme.

[Theme]
name = Air Nomads
# Built-in scheme for any color not set below.
scheme = nord
# Effects from ~/.local/share/speshell/effects.
effects = air

[Colors]
base     = #151a21
mantle   = #11151b
crust    = #0c0f13
surface0 = #1f2631
surface1 = #2b3441
surface2 = #3a4554
overlay0 = #5e6b7d
text     = #e8eef4
subtext0 = #9ba9b8
subtext1 = #bdc8d3
peach    = #f0a03c
yellow   = #f5c75a
sky      = #7cc0ea
blue     = #6aa6dc
teal     = #8cc7c9
rosewater = #e8eef4
accent   = #f0a03c
