# Speshell configuration
# Location: ~/.config/speshell/config.ini
# Edit this file or use the in-app Settings panel.

[Appearance]
# Colors, wallpapers, and effects come from the theme: pick one with !theme in the
# launcher or in the dashboard's Themes panel. Add your own as folders in
# ~/.config/speshell/themes.

# Draw the theme's wallpaper as the desktop background (true or false). Leave it
# false to keep another wallpaper tool in charge.
drawWallpaper = false

# Speed of the theme's transitions on each surface (0-3): 1 is normal, 0.5 half
# speed, 2 twice as fast. 0 turns them off: the launcher and dashboard show at
# once and wallpapers swap at once. The dashboard's speed also paces the theme's
# effects on its sliders, switches, and choices.
launcherTransitionSpeed = 1.0
dashboardTransitionSpeed = 1.0
wallpaperTransitionSpeed = 1.0

# Pick at random each time Speshell starts: off, wallpaper (another wallpaper of
# the theme), theme (another theme, with the wallpaper last set for it), or both.
shuffleAtLaunch = off

# Speshell text scale (0.8-1.5). This does not change monitor or application scaling.
textScale = 1.0

# Surface geometry (panelWidth: 240-1200, panelMargin: 0-128)
panelWorkspace = special:term
panelWidth = 420
panelMargin = 16

[Bar]
# Experimental: a bar on every screen with workspaces, the clock, the playing track,
# a running timer, the tray, and icons that open the dashboard's own panels.
# Where it sits: off, top, or bottom
position = off
# Bar height in px (24-64)
height = 40
# Bar width in percent of the screen (20-100), centered; it grows to fit its contents
width = 100
# Space between the screen's edge and the bar in px (0-64); 0 docks it to the edge
margin = 0
# Space between the bar and the windows in px (0-64)
gap = 0
# Frame the bar on the sides away from the screen's edges (edges), or on every
# side, along the screen's edges too (full)
outline = edges

[Audio]
# Dashboard audio panel mode: combined (one panel; the sidebar icon's top half
# scrolls the speaker and its bottom half the mic) or separate (one sidebar icon
# each). The bar always has one icon and panel each.
panelMode = combined
# Volume change per wheel step (1-100)
scrollStep = 5

# Optional case-insensitive substring filters. Add numbered entries in display order.
# Empty sections show every available device.
[Audio.QuickSwitch]
# 1 = Built-in Audio
# 2 = Display, HDMI

[Audio.InputQuickSwitch]
# 1 = Microphone

# Optional display-name overrides. Keys may be PipeWire names or descriptions.
[Audio.DeviceNames]
# alsa_output.pci-0000_00_1f.3.analog-stereo = Speakers

[Audio.InputDeviceNames]
# alsa_input.pci-0000_00_1f.3.analog-stereo = Microphone

[Launcher]
# Width in px (280-1200) and result rows shown before scrolling (1-20)
width = 540
visibleRows = 5
# Where ? queries and unknown bangs go: HTTPS, with one {query}
searchUrl = https://duckduckgo.com/?q={query}

# Your own bangs, as !name query: HTTPS URLs, each with one {query}
[Launcher.Bangs]
gh = https://github.com/search?q={query}
yt = https://www.youtube.com/results?search_query={query}

[Backlight]
# Leave empty to auto-detect the backlight device under /sys/class/backlight
device =

[Power]
# How much power Speshell uses:
# - maximum: the theme's effects animate at the display's refresh rate, and a
#   recording started outside Speshell shows within 2 s.
# - balanced: the effects animate at 60 fps, and those recordings show within 10 s.
# - saver: no theme effects (the launcher and dashboard show at once and wallpapers
#   swap at once), no motion in the interface, and those recordings show within a
#   minute.
# Recordings and dictation started from Speshell's tools show at once in every mode.
mode = balanced

lockCommand = hyprlock

# Optional arguments passed directly to the locker executable, in numbered order
[Power.Arguments]
# 1 = --daemonize

[Weather]
# Leave location empty to auto-detect based on system locale / IP address
enabled = false
location =

[Tools]
# The Tools panel (bar and dashboard) shows each tool once the programs it needs
# are installed; see the README. Keybindings can run them too, as speshell tool
# dictate, ocr, screenshot, record, qr, or color.

# Languages the text in screen areas is in, as Tesseract codes (eng, por, deu…),
# each with its tesseract-data package installed
ocrLanguages = eng
# Languages you dictate in, as Whisper codes (en, pt, de…). Empty detects any;
# with several, a clip detected as another language is redone in the closest one.
dictationLanguages =
# Uncommon words Whisper should spell this way, comma-separated
dictationVocabulary =
# Whisper model file. Empty uses ggml-large-v3-turbo-q5_0.bin in
# ~/.local/share/speshell/whisper; a missing ggml-*.bin is downloaded on first use.
dictationModel =

[Notifications]
# Maximum toast notifications on screen at once (1-50, or -1 for all)
maxVisible = 3
